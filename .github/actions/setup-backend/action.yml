name: "Setup Backend"
description: "Sets up Python environment, installs system dependencies, and installs Python packages"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.14"
  install-deps:
    description: "Whether to install dependencies"
    required: false
    default: "true"
  install-dev-tools:
    description: "Whether to install development tools (ruff, mypy, pytest)"
    required: false
    default: "true"
  enable-cache:
    description: "Whether to enable pip cache"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: inputs.enable-cache == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt
          backend/pyproject.toml

    - name: Set up Python
      if: inputs.enable-cache != 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies
      shell: bash
      if: inputs.install-deps == 'true'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libmagic1

    - name: Install Python dependencies
      shell: bash
      if: inputs.install-deps == 'true'
      env:
        INSTALL_DEV_TOOLS: ${{ inputs.install-dev-tools }}
      run: |
        cd backend
        pip install --upgrade pip --prefer-binary
        if [ "$INSTALL_DEV_TOOLS" = "true" ]; then
          pip install -r requirements-dev.txt --prefer-binary
        else
          pip install -r requirements.txt --prefer-binary
        fi
