name: "Setup Frontend"
description: "Sets up Node.js environment and installs NPM packages"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  install-deps:
    description: "Whether to install dependencies"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "package-lock.json"
        registry-url: "https://registry.npmjs.org/"

    - name: Install dependencies
      shell: bash
      if: inputs.install-deps == 'true'
      run: |
        # Clear any potential proxy or registry issues at root
        # npm config commands do not support workspaces, so they must run at root
        npm config delete proxy || true
        npm config delete https-proxy || true
        npm config set registry https://registry.npmjs.org/

        # Install the exact dependency graph from the committed root lockfile.
        npm ci --prefer-offline --no-audit
