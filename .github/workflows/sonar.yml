name: SonarCloud Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check SonarCloud configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarCloud scan skipped because SONAR_TOKEN is not configured."
          fi

      - name: Setup backend for coverage
        if: steps.sonar-config.outputs.configured == 'true'
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.14"
          install-deps: "true"
          install-dev-tools: "true"
          enable-cache: "true"

      - name: Run backend coverage
        if: steps.sonar-config.outputs.configured == 'true'
        run: |
          cd backend
          pytest --cov=app --cov=scripts --cov-report=xml:coverage.xml --cov-report=term

      - name: Setup frontend for coverage
        if: steps.sonar-config.outputs.configured == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "24"

      - name: Run frontend coverage
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm run test:coverage -w frontend

      - name: Run SonarCloud scan
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
