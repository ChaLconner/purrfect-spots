services:
  # ==========================================================================
  # Backend API
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purrfect-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - QUEUE_REDIS_URL=redis://redis-queue:6379
      - ENABLE_STRIPE_WEBHOOK_QUEUE=true
      - ENABLE_VISION_ANALYSIS_QUEUE=true
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - purrfect-network

  # ========================================================================
  # Backend Worker (Stripe webhooks and Google Vision analysis)
  # ========================================================================
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purrfect-backend-worker
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - QUEUE_REDIS_URL=redis://redis-queue:6379
      - ENABLE_STRIPE_WEBHOOK_QUEUE=true
      - ENABLE_VISION_ANALYSIS_QUEUE=true
    command: ["python", "-m", "app.worker"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis-queue:
        condition: service_healthy
    networks:
      - purrfect-network

  # ==========================================================================
  # Frontend (Nginx Production Build)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: purrfect-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - purrfect-network

  # ==========================================================================
  # Redis - Isolated Data Caching
  # ==========================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: purrfect-redis-cache
    restart: always
    volumes:
      - redis-cache-data:/data
    # Cache data is disposable; avoid AOF fsync/write amplification on every cache mutation.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purrfect-network

  # ========================================================================
  # Redis - Durable queue storage (no eviction)
  # ========================================================================
  redis-queue:
    image: redis:7-alpine
    container_name: purrfect-redis-queue
    restart: always
    volumes:
      - redis-queue-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purrfect-network

  # ==========================================================================
  # Redis - Isolated Rate Limiting
  # ==========================================================================
  redis-ratelimit:
    image: redis:7-alpine
    container_name: purrfect-redis-ratelimit
    restart: always
    volumes:
      - redis-ratelimit-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purrfect-network

networks:
  purrfect-network:
    driver: bridge

volumes:
  redis-cache-data:
    driver: local
  redis-queue-data:
    driver: local
  redis-ratelimit-data:
    driver: local
