[project]
name = "purrfect-spots"
version = "3.1.0"
description = "PurrFect Spots API - Helping you share and discover cat locations"
authors = [
    { name = "Purrfect Spots Team", email = "support@purrfectspots.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "starlette>=0.40.0",
    "uvicorn>=0.50.0",
    "orjson>=3.10.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "httpx>=0.28.1",
    "PyJWT>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.64.0",
    "slowapi>=0.1.10",
    "redis>=8.0.1",
    "google-cloud-vision>=3.15.0",
    "boto3>=1.34.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "structlog>=26.1.0",
    "python-json-logger>=4.1.0,<5.0.0",
    "sqlalchemy>=2.0.51",
    "greenlet>=3.5.3",
    "asyncpg>=0.31.0",
    "email-validator>=2.1.0",
    "bleach>=6.4.0",
    "filetype>=1.2.0",
    "Pillow>=12.3.0",
    "stripe>=15.3.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "anyio>=4.14.1",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "Faker>=24.0.0",
    "pyfakefs>=5.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["B008", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["venv", ".venv", "migrations"]

[[tool.mypy.overrides]]
module = [
    "sentry_sdk.*",
    "slowapi.*",
    "supabase.*",
    "supabase_auth",
    "supabase_auth.*",
    "gotrue.*",
    "storage3.*",
    "google.cloud.*",
    "redis.*",
    "pythonjsonlogger.*",
    "boto3.*",
    "botocore.*",
    "filetype.*",
    "structlog"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-p",
    "no:cacheprovider",
    "-v",
    "--tb=short",
    "--color=yes",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = [
    # Ignore deprecation warnings from external libraries
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning",
    "ignore:.*Image.Image.getdata.*:DeprecationWarning",
    "ignore:.*datetime.datetime.utcnow.*:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore::DeprecationWarning:gotrue.*",
    "ignore::DeprecationWarning:storage3.*",
    "ignore:.*The `gotrue` package is deprecated.*:DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
    "ignore:.*ORJSONResponse is deprecated.*",
    # Pydantic deprecated Extra (V2 migration) - ignore in dependencies
    "ignore:.*pydantic.config.Extra is deprecated.*:DeprecationWarning",
    "ignore:.*pydantic.config.Extra is deprecated.*:pydantic.PydanticDeprecatedSince20",
    # Pytest-asyncio loop scope warnings
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise importError",
]
