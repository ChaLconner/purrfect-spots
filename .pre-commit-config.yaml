repos:
  # ==============================================================================
  # Python Linting & Formatting
  # ==============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: Ruff Linting
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        files: ^backend/
      - id: ruff-format
        name: Ruff Formatting
        types_or: [python, pyi]
        files: ^backend/

  # ==============================================================================
  # Security Scanning
  # ==============================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        name: Bandit Security Scan
        args: [-c, backend/pyproject.toml, -r, backend, -lll]
        files: ^backend/
        exclude: ^backend/tests/

  # ==============================================================================
  # Dependency Security Scanning (NEW)
  # ==============================================================================
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        name: Pip Audit (Backend Dependencies)
        args: ["-r", "backend/requirements.txt"]
        files: ^backend/requirements.txt$

  # ==============================================================================
  # Secret Detection
  # ==============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect Secrets
        exclude: package-lock\.json|\.env\.example|frontend/dist/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan

  # ==============================================================================
  # General Hooks
  # ==============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Check YAML
      - id: check-json
        name: Check JSON
      - id: check-added-large-files
        name: Check Large Files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
        name: Detect Private Keys

  # ==============================================================================
  # Frontend Linting (Local)
  # ==============================================================================
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm --workspace frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(js|jsx|ts|tsx|vue)$

      - id: typescript-check
        name: TypeScript Check
        entry: npm --workspace frontend run type-check
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|vue)$

# ==============================================================================
# Configuration
# ==============================================================================
default_stages: [pre-commit]
fail_fast: false
